name: Build OpenStudio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check privacy-sensitive Android settings
        run: python3 scripts/privacy_guard.py

  build:
    runs-on: ubuntu-latest
    needs: privacy-guard
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Run unit tests if present
        run: gradle --no-daemon testDebugUnitTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenStudio-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
