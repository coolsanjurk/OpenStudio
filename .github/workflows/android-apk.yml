name: Build OpenStudio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check privacy-sensitive Android settings
        run: python3 scripts/privacy_guard.py

  build:
    runs-on: ubuntu-latest
    needs: privacy-guard
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager "ndk;26.3.11579264"
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/openstudio_native/Cargo.toml
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust native libraries
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          cargo ndk -t arm64-v8a -t x86_64 -o app/src/main/jniLibs build --release --manifest-path rust/openstudio_native/Cargo.toml
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify packaged native libraries
        run: |
          test -f app/src/main/jniLibs/arm64-v8a/libopenstudio_native.so
          test -f app/src/main/jniLibs/x86_64/libopenstudio_native.so
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Run unit tests if present
        run: gradle --no-daemon testDebugUnitTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenStudio-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
